<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracking System</title>
    <!-- অফলাইন সিএসএস ব্যাকআপ এবং কোর স্টাইলিং লোডার -->
    <style>
        body { font-family: sans-serif; background-color: #f8fafc; color: #1e293b; padding: 40px; margin: 0; }
        .container { max-width: 1100px; margin: 0 auto; }
        .title { text-align: center; font-size: 32px; font-weight: 800; margin-bottom: 30px; }
        .flex-center { display: flex; justify-content: center; gap: 16px; margin-bottom: 30px; }
        .btn { padding: 12px 24px; font-weight: 600; text-decoration: none; border-radius: 8px; color: white; display: inline-block; cursor: pointer; border: none; font-size: 15px; text-align: center; }
        .btn-blue { background-color: #4f46e5; }
        .btn-blue:hover { background-color: #4338ca; }
        .btn-slate { background-color: #475569; }
        .btn-slate:hover { background-color: #334155; }
        .card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; }
    </style>
</head>
<body>
    <div class="container">
        <!-- ড্যাশবোর্ড টাইটেল হেডার -->
        <h1 class="title">💰 Expense Tracking System</h1>

        <!-- বিশুদ্ধ অফলাইন নেভিগেশন লিংকসমূহ -->
        <div class="flex-center">
            <a href="/ui/add-update" class="btn btn-blue">📝 Add / Update Expenses</a>
            <a href="/ui/analytics" class="btn btn-slate">📈 Analytics</a>
        </div>

        <!-- মেইন কন্টেন্ট বাক্স: এখানে বাকি পেজগুলো এসে রেন্ডার হবে -->
        <div id="main-content" class="card">
            {% block content %}{% endblock %}
        </div>
    </div>
</body>
</html>
